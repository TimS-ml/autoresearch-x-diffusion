[project]
name = "autoresearch"
version = "0.3.0"
description = "Autonomous LLM-driven research on x-transformers LM and x-DDPM diffusion, enwik8"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "pandas",
    "loguru",
    "einx",
    "ema-pytorch",
    "adam-atan2-pytorch",
    "x-transformers @ git+https://github.com/TimS-ml/x-transformers.git",
    "torchao>=0.16.0",
    # x-DDPM dependencies
    "einops",
    "accelerate",
    "tqdm",
    "scipy",
    "Pillow",
    "torchvision",
]

[project.optional-dependencies]
analysis = [
    "jupytext",
]
